<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeCraft Real-World Refinement Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --background: 240 10% 3.9%;
      --foreground: 0 0% 98%;
      --card: 240 10% 3.9%;
      --card-foreground: 0 0% 98%;
      --muted: 240 3.7% 15.9%;
      --muted-foreground: 240 5% 64.9%;
      --border: 240 3.7% 15.9%;
      --ring: 240 4.9% 83.9%;
      --primary: 0 0% 98%;
      --primary-foreground: 240 5.9% 10%;
    }

    body {
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* Strict Single Focus Ring Rule */
    .focus-ring-single:focus-visible {
      outline: none !important;
      box-shadow: 0 0 0 2px hsl(var(--background)), 0 0 0 4px hsl(var(--ring)) !important;
    }

    /* SVG Chart Overflow Safety */
    .svg-chart-container {
      overflow: visible !important;
    }
  </style>
</head>
<body class="p-6 md:p-10 flex flex-col md:flex-row gap-8 max-w-7xl mx-auto">

  <!-- B. SIDEBAR NAVIGATION (4-State Grammar) -->
  <aside className="w-full md:w-64 bg-card border border-[hsl(var(--border))] rounded-xl p-5 shrink-0 flex flex-col gap-6">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-white text-sm">VC</div>
      <span class="font-semibold text-lg tracking-tight">VibeCraft Analytics</span>
    </div>

    <nav class="flex flex-col gap-1.5" aria-label="Main Navigation">
      <span class="text-xs font-semibold text-[hsl(var(--muted-foreground))] uppercase tracking-wider px-3 mb-1">Dashboards</span>
      
      <!-- 1. SELECTED / CURRENT (aria-current="page") -->
      <a href="#overview" aria-current="page" class="flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-semibold bg-white/10 text-white border border-white/15 shadow-sm transition-all">
        <div class="flex items-center gap-3">
          <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          <span>Overview</span>
        </div>
        <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
      </a>

      <!-- 2. DEFAULT STATE -->
      <a href="#analytics" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-[hsl(var(--muted-foreground))] hover:text-white hover:bg-white/5 transition-all">
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <span>Analytics (Default)</span>
      </a>

      <!-- 3. HOVER DEMO STATE -->
      <a href="#customers" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-white bg-white/5 transition-all">
        <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <span>Customers (Hover)</span>
      </a>

      <!-- 4. ACTIVE / PRESSED STATE -->
      <a href="#settings" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-white bg-white/15 scale-[0.98] transition-all">
        <svg class="w-4 h-4 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg>
        <span>Settings (Pressed)</span>
      </a>
    </nav>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <main class="flex-1 flex flex-col gap-6">

    <!-- HEADER WITH SEARCH INPUT (Single Focus-Visible Rule) -->
    <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-card border border-[hsl(var(--border))] rounded-xl p-5">
      <div class="flex flex-col">
        <h1 class="text-xl font-bold text-white tracking-tight">Revenue Overview</h1>
        <p class="text-xs text-[hsl(var(--muted-foreground))]">Real-World Refinement Test Verification Page</p>
      </div>

      <!-- A. SEARCH INPUT (STRICT SINGLE FOCUS INDICATOR) -->
      <div class="relative w-full sm:w-72">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[hsl(var(--muted-foreground))]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input 
          id="search-input"
          type="text" 
          placeholder="Search metrics..." 
          class="w-full pl-9 pr-4 py-2 bg-background border border-[hsl(var(--border))] rounded-lg text-sm text-white placeholder:text-[hsl(var(--muted-foreground))] focus-ring-single focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[hsl(var(--ring))] focus-visible:ring-offset-2 transition-all"
        />
      </div>
    </header>

    <!-- C. SVG CHART SECTION (STRICT PADDED GEOMETRY & OVERFLOW: VISIBLE) -->
    <section class="bg-card border border-[hsl(var(--border))] rounded-xl p-6 flex flex-col gap-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-base font-semibold text-white">Monthly Recurring Revenue</h2>
          <p class="text-xs text-[hsl(var(--muted-foreground))]">Guaranteed P_svg >= 8px stroke padding & overflow: visible</p>
        </div>
        <span class="text-lg font-bold text-emerald-400 tabular-nums">$128,450.00</span>
      </div>

      <!-- SVG CHART CANVAS CONTAINER -->
      <div class="w-full h-56 pt-2 pb-2 px-2 border border-white/5 rounded-lg bg-black/20 flex items-center justify-center">
        <!-- SVG element with internal vertical stroke padding P_svg = 8px and overflow: visible -->
        <svg class="w-full h-full svg-chart-container" viewBox="0 0 600 160" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>
            </linearGradient>
          </defs>

          <!-- Grid Lines -->
          <line x1="10" y1="12" x2="590" y2="12" stroke="#ffffff10" stroke-dasharray="4 4" />
          <line x1="10" y1="50" x2="590" y2="50" stroke="#ffffff10" stroke-dasharray="4 4" />
          <line x1="10" y1="90" x2="590" y2="90" stroke="#ffffff10" stroke-dasharray="4 4" />
          <line x1="10" y1="130" x2="590" y2="130" stroke="#ffffff10" stroke-dasharray="4 4" />

          <!-- Filled Area Under Curve (P_svg = 12px min padding) -->
          <polygon points="12,148 12,100 110,60 210,110 310,35 410,75 510,15 588,50 588,148" fill="url(#chartGradient)" />

          <!-- Main Stroke Line (P_svg = 12px top/bottom padding to guarantee no clipping) -->
          <path 
            d="M 12 100 L 110 60 L 210 110 L 310 35 L 410 75 L 510 15 L 588 50" 
            fill="none" 
            stroke="#6366f1" 
            stroke-width="3" 
            stroke-linecap="round" 
            stroke-linejoin="round"
          />

          <!-- Data Points -->
          <circle cx="12" cy="100" r="4" fill="#6366f1" stroke="#ffffff" stroke-width="2" />
          <circle cx="110" cy="60" r="4" fill="#6366f1" stroke="#ffffff" stroke-width="2" />
          <circle cx="210" cy="110" r="4" fill="#6366f1" stroke="#ffffff" stroke-width="2" />
          <circle cx="310" cy="35" r="4" fill="#6366f1" stroke="#ffffff" stroke-width="2" />
          <circle cx="410" cy="75" r="4" fill="#6366f1" stroke="#ffffff" stroke-width="2" />
          <circle cx="510" cy="15" r="4" fill="#6366f1" stroke="#ffffff" stroke-width="2" />
          <circle cx="588" cy="50" r="4" fill="#6366f1" stroke="#ffffff" stroke-width="2" />
        </svg>
      </div>
    </section>
  </main>
</body>
</html>
